name: Linux distro tests

# Builds and tests ModHearth on non-Debian Linux distributions.
# The main build.yml only covers Ubuntu, so regressions that are specific to
# Fedora/Arch/openSUSE (package layout, OpenSSL, fonts, X11) would go unnoticed.

# yaml-embedded-languages: shell

on:
    push:
        branches: ["main"]
        paths-ignore:
            - "**/*.md"
            - "docs/**"
            - ".github/ISSUE_TEMPLATE/**"
    pull_request:
        paths-ignore:
            - "**/*.md"
            - "docs/**"
            - ".github/ISSUE_TEMPLATE/**"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    # Keep the SDK and NuGet caches inside the workspace so actions/cache can
    # persist them between runs (the container itself is always ephemeral).
    DOTNET_ROOT: ${{ github.workspace }}/.dotnet
    NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    # The openSUSE image does not define PATH in its container config. Without
    # one, prepending a directory (e.g. via GITHUB_PATH) would leave PATH with
    # only that directory, and the next step would fail with
    # `exec: "bash": executable file not found in $PATH`. Define a normal PATH
    # that also contains the cached SDK instead.
    PATH: ${{ github.workspace }}/.dotnet:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    DOTNET_CHANNEL: "10.0"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    NUGET_XMLDOC_MODE: "skip"
    # Skia/Avalonia fall back to a software GL surface; there is no GPU in CI.
    LIBGL_ALWAYS_SOFTWARE: "1"

jobs:
    test:
        name: ${{ matrix.name }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        container:
            # Base images run as root, which the package managers below require.
            image: ${{ matrix.image }}
            options: --user root
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Pinned instead of fedora:latest on purpose: Fedora 45 ships
                    # OpenSSL 4.0, which .NET 8 cannot load ("No usable version of
                    # libssl was found"). Fedora 44 is still supported and ships
                    # OpenSSL 3.x.
                    - name: Fedora 44
                      image: fedora:44
                      distro: fedora
                      git_bootstrap: dnf install -y git
                    - name: Arch Linux
                      image: archlinux:latest
                      distro: arch
                      git_bootstrap: pacman -Syu --noconfirm --needed git
                    - name: openSUSE Tumbleweed
                      image: opensuse/tumbleweed:latest
                      distro: opensuse
                      git_bootstrap: zypper --non-interactive refresh && zypper --non-interactive install git
        steps:
            # These images do not ship git, but actions/checkout requires it. This
            # step has to run before checkout, so it cannot use the repo script.
            - name: Bootstrap git
              shell: bash
              run: ${{ matrix.git_bootstrap }}

            - name: Checkout
              uses: actions/checkout@v4

            - name: Install native dependencies
              shell: bash
              run: bash .github/scripts/install-linux-test-deps.sh ${{ matrix.distro }}

            # The SDK is ~200 MB and changes rarely, so cache it per distribution
            # instead of re-downloading it on every run. Bump the "-v1" suffix to
            # force a refresh.
            - name: Cache .NET SDK
              uses: actions/cache@v4
              with:
                  path: ${{ env.DOTNET_ROOT }}
                  key: dotnet-sdk-${{ matrix.distro }}-${{ env.DOTNET_CHANNEL }}-v1

            - name: Install .NET SDK
              shell: bash
              run: |
                  if [ ! -x "$DOTNET_ROOT/dotnet" ]; then
                    curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
                    bash /tmp/dotnet-install.sh \
                      --channel "$DOTNET_CHANNEL" \
                      --install-dir "$DOTNET_ROOT" \
                      --no-path
                  fi
                  "$DOTNET_ROOT/dotnet" --info

            - name: Cache NuGet packages
              uses: actions/cache@v4
              with:
                  path: ${{ env.NUGET_PACKAGES }}
                  key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/global.json') }}
                  restore-keys: |
                      nuget-${{ runner.os }}-

            - name: Restore
              shell: bash
              run: dotnet restore ModHearth.sln

            - name: Build
              shell: bash
              run: dotnet build ModHearth.sln -c Release --no-restore

            # Avalonia uses its X11 backend here, so the UI smoke tests need a
            # virtual display. Skia also needs fontconfig/freetype (installed above).
            - name: Test
              shell: bash
              run: |
                  xvfb-run -a --server-args="-screen 0 1280x1024x24" \
                    dotnet test ModHearth.sln -c Release --no-build --no-restore \
                    --logger "trx;LogFileName=ModHearth.App.Tests.trx" \
                    --results-directory artifacts/test-results

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results-${{ matrix.distro }}
                  path: artifacts/test-results/**/*.trx
                  if-no-files-found: ignore
