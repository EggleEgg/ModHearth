name: Build & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.compute.outputs.build_number }}
    steps:
      - name: Compute build number
        id: compute
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          repo = os.environ.get("GITHUB_REPOSITORY")
          token = os.environ.get("GITHUB_TOKEN")
          url = f"https://api.github.com/repos/{repo}/releases/latest"
          headers = {"Accept": "application/vnd.github+json"}
          if token:
              headers["Authorization"] = f"Bearer {token}"
          req = urllib.request.Request(url, headers=headers)
          tag = ""
          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.load(resp)
                  tag = data.get("tag_name") or ""
          except Exception:
              tag = ""
          match = re.match(r"build-(\d+)", tag)
          default_start = 28
          build = int(match.group(1)) + 1 if match else default_start
          if build < default_start:
              build = default_start
          print(f"Computed build number: {build}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"build_number={build}\n")
          PY

  build-test-publish:
    runs-on: ${{ matrix.os }}
    needs: compute-version
    if: ${{ needs.compute-version.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            ext: zip
          - os: ubuntu-latest
            rid: linux-x64
            ext: tar.gz
          - os: macos-latest
            rid: osx-x64
            ext: tar.gz
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets
      - name: Restore
        run: dotnet restore ModHearth.sln
      - name: Restore publish runtime assets
        run: dotnet restore ModHearth.csproj -r ${{ matrix.rid }}
      - name: Build
        run: dotnet build ModHearth.sln -c Release --no-restore
      - name: Test (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          echo "Running UI tests under Xvfb (required for Skia smoke test)."
          if ! xvfb-run -a dotnet test ModHearth.sln -c Release --no-build --no-restore; then
            echo "Tests failed. This can include the Skia native smoke test on Linux."
            exit 1
          fi
      - name: Test (Windows/macOS)
        if: matrix.os != 'ubuntu-latest'
        run: dotnet test ModHearth.sln -c Release --no-build --no-restore
      - name: Build publish runtime target
        run: dotnet build ModHearth.csproj -c Release -r ${{ matrix.rid }} --no-restore /p:MoveOutputDlls=false
      - name: Publish
        run: dotnet publish ModHearth.csproj -c Release -r ${{ matrix.rid }} --self-contained false /p:UseAppHost=true /p:InformationalVersion=${{ needs.compute-version.outputs.build_number }} /p:MoveOutputDlls=false --no-build --no-restore
      - name: Prune + verify + package (Windows)
        if: matrix.os == 'windows-latest'
        run: ./.github/scripts/prune-package.ps1 -Rid "${{ matrix.rid }}" -Ext "${{ matrix.ext }}"
      - name: Prune + verify + package (Unix)
        if: matrix.os != 'windows-latest'
        run: bash ./.github/scripts/prune-package.sh "${{ matrix.rid }}" "${{ matrix.ext }}"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModHearth-${{ matrix.rid }}
          path: dist/ModHearth-${{ matrix.rid }}.${{ matrix.ext }}

  release:
    runs-on: ubuntu-latest
    needs: [build-test-publish, compute-version]
    if: ${{ needs.build-test-publish.result == 'success' && needs.compute-version.result == 'success' }}
    steps:
      - name: Normalize build tag
        id: release_tag
        run: |
          raw="${{ needs.compute-version.outputs.build_number }}"
          raw="$(echo -n "$raw" | tr -d '\r\n' | xargs)"
          raw="${raw//\\n/}"
          raw="${raw//\\r/}"
          if [ -z "$raw" ]; then
            echo "Missing build number from compute-version."
            exit 1
          fi
          tag="build-$raw"
          name="Build $raw"
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "name=$name" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List release artifacts
        run: ls -la dist
      - name: Create release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release_tag.outputs.tag }}
          release_name: ${{ steps.release_tag.outputs.name }}
          body: ${{ github.sha }}
          file: dist/*
          file_glob: true
          overwrite: true

  release-status:
    runs-on: ubuntu-latest
    needs: [build-test-publish, compute-version, release]
    if: ${{ always() }}
    steps:
      - name: Report release status
        run: |
          if [ "${{ needs.build-test-publish.result }}" != "success" ]; then
            echo "Release skipped because test/publish job failed."
            exit 0
          fi
          if [ "${{ needs.compute-version.result }}" != "success" ]; then
            echo "Release skipped because build number could not be computed."
            exit 0
          fi
          if [ "${{ needs.release.result }}" != "success" ]; then
            echo "Release did not complete successfully."
            exit 1
          fi
          echo "Release completed successfully."
