name: Build & Release

# yaml-embedded-languages: python

on:
  push:
    branches: ["main"]
  workflow_dispatch: # Allows triggering releases manually

permissions:
  contents: write

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.compute.outputs.build_number }}
    steps:
      - name: Compute build number
        id: compute
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLEEDING_EDGE_TOKEN: ${{ secrets.BLEEDING_EDGE_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        # TODO Move this to its own file
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          repo = os.environ.get("GITHUB_REPOSITORY")
          token = os.environ.get("GITHUB_TOKEN")
          be_token = os.environ.get("BLEEDING_EDGE_TOKEN")
          event_name = os.environ.get("GITHUB_EVENT_NAME")

          # 1. Fetch latest release from the main production repository
          url_main = f"https://api.github.com/repos/{repo}/releases/latest"
          headers_main = {"Accept": "application/vnd.github+json"}
          if token:
              headers_main["Authorization"] = f"Bearer {token}"

          main_tag = ""
          try:
              req = urllib.request.Request(url_main, headers=headers_main)
              with urllib.request.urlopen(req) as resp:
                  data = json.load(resp)
                  main_tag = data.get("tag_name") or ""
          except Exception:
              main_tag = ""

          match_main = re.match(r"build-(\d+)", main_tag)
          default_start = 28
          main_build = int(match_main.group(1)) + 1 if match_main else default_start
          if main_build < default_start:
              main_build = default_start

          # 2. Determine final version string based on execution trigger
          if event_name == "workflow_dispatch":
              # Production releases get standard clean integer versions (e.g., "45")
              final_version = str(main_build)
          else:
              # Bleeding edge pushes get fractional version formatting (e.g., "45.1")
              be_repo = "EggleEgg/ModHearth-Builds"
              url_be = f"https://api.github.com/repos/{be_repo}/releases/latest"
              headers_be = {"Accept": "application/vnd.github+json"}
              use_token = be_token or token
              if use_token:
                  headers_be["Authorization"] = f"Bearer {use_token}"
              
              be_tag = ""
              try:
                  req_be = urllib.request.Request(url_be, headers=headers_be)
                  with urllib.request.urlopen(req_be) as resp:
                      data = json.load(resp)
                      be_tag = data.get("tag_name") or ""
              except Exception:
                  be_tag = ""
              
              # Check if the latest bleeding edge build belongs to the current main_build block
              pattern = rf"build-{main_build}\.(\d+)"
              match_be = re.match(pattern, be_tag)
              if match_be:
                  sub_build = int(match_be.group(1)) + 1
              else:
                  # Reset back to .1 if the main build incremented or no releases exist
                  sub_build = 1
              
              final_version = f"{main_build}.{sub_build}"

          print(f"Computed build number: {final_version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"build_number={final_version}\n")
          PY

  build-test-publish:
    runs-on: ${{ matrix.os }}
    needs: compute-version
    if: ${{ needs.compute-version.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            ext: zip
          - os: ubuntu-latest
            rid: linux-x64
            ext: tar.gz
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets
      - name: Restore
        run: dotnet restore ModHearth.sln
      - name: Restore publish runtime assets
        run: dotnet restore ModHearth.csproj -r ${{ matrix.rid }}
      - name: Build
        run: dotnet build ModHearth.sln -c Release --no-restore
      - name: Test (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          echo "Running UI tests under Xvfb (required for Skia smoke test)."
          if ! xvfb-run -a dotnet test ModHearth.sln -c Release --no-build --no-restore; then
            echo "Tests failed. This can include the Skia native smoke test on Linux."
            exit 1
          fi
      - name: Test (Windows)
        if: matrix.os != 'ubuntu-latest'
        run: dotnet test ModHearth.sln -c Release --no-build --no-restore
      - name: Build publish runtime target
        run: dotnet build ModHearth.csproj -c Release -r ${{ matrix.rid }} --no-restore /p:InformationalVersion=${{ needs.compute-version.outputs.build_number }}
      - name: Publish
        run: >
          dotnet publish ModHearth.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained false
          --no-build
          --no-restore
          -o artifacts/${{ matrix.rid }}
      - name: Prune + verify + package (Windows)
        if: matrix.os == 'windows-latest'
        run: ./.github/scripts/prune-package.ps1 -Rid "${{ matrix.rid }}" -Ext "${{ matrix.ext }}"
      - name: Prune + verify + package (Unix)
        if: matrix.os != 'windows-latest'
        run: bash ./.github/scripts/prune-package.sh "${{ matrix.rid }}" "${{ matrix.ext }}"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModHearth-${{ matrix.rid }}
          path: dist/ModHearth-${{ matrix.rid }}.${{ matrix.ext }}

  # --- Manual trigger ---
  release:
    runs-on: ubuntu-latest
    needs: [build-test-publish, compute-version]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.build-test-publish.result == 'success' && needs.compute-version.result == 'success' }}
    steps:
      - name: Normalize build tag
        id: release_tag
        run: |
          raw="${{ needs.compute-version.outputs.build_number }}"
          raw="$(echo -n "$raw" | tr -d '\r\n' | xargs)"
          raw="${raw//\\n/}"
          raw="${raw//\\r/}"
          if [ -z "$raw" ]; then
            echo "Missing build number from compute-version."
            exit 1
          fi
          echo "tag=build-$raw" >> $GITHUB_OUTPUT
          echo "name=Build $raw" >> $GITHUB_OUTPUT

      - name: Checkout Git history only
        uses: actions/checkout@v4
        with:
          fetch-depth: 5
          sparse-checkout: .github
          sparse-checkout-cone-mode: false

      - name: Get commit message
        id: get_commit_message
        run: |
          commit_message=$(git log -1 --pretty=%s)
          echo "commit_message=$commit_message" >> $GITHUB_OUTPUT

      - name: Set release body
        id: set_release_body
        run: |
          body_content=""
          if [[ "${{ steps.get_commit_message.outputs.commit_message }}" == Merge* ]]; then
            parent_shas=$(git log -1 --pretty=%P)
            for parent_sha in $parent_shas;
            do
              if [ -n "$body_content" ]; then
                body_content+=$'\n\n'
              fi
              body_content+=$(git log --format=%B -n 1 $parent_sha)
            done
          else
            body_content="${{ steps.get_commit_message.outputs.commit_message }}"
          fi
          {
            echo "body<<EOF"
            echo "$body_content"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release_tag.outputs.tag }}
          release_name: ${{ steps.release_tag.outputs.name }}
          body: ${{ steps.set_release_body.outputs.body }}
          file: dist/*
          file_glob: true
          overwrite: true

  # --- Runs on push (automatic) ---
  bleeding-edge-push:
    runs-on: ubuntu-latest
    needs: [build-test-publish, compute-version]
    if: ${{ github.event_name == 'push' && needs.build-test-publish.result == 'success' && needs.compute-version.result == 'success' }}
    steps:
      - name: Normalize build tag
        id: release_tag
        run: |
          raw="${{ needs.compute-version.outputs.build_number }}"
          raw="$(echo -n "$raw" | tr -d '\r\n' | xargs)"
          raw="${raw//\\n/}"
          raw="${raw//\\r/}"
          if [ -z "$raw" ]; then
            echo "Missing build number from compute-version."
            exit 1
          fi
          echo "tag=build-$raw" >> $GITHUB_OUTPUT
          echo "name=BE Build $raw" >> $GITHUB_OUTPUT

      - name: Checkout Git history only
        uses: actions/checkout@v4
        with:
          fetch-depth: 5
          sparse-checkout: .github
          sparse-checkout-cone-mode: false

      - name: Get commit message
        id: get_commit_message
        run: |
          commit_message=$(git log -1 --pretty=%s)
          echo "commit_message=$commit_message" >> $GITHUB_OUTPUT

      - name: Set release body
        id: set_release_body
        run: |
          body_content=""
          if [[ "${{ steps.get_commit_message.outputs.commit_message }}" == Merge* ]]; then
            parent_shas=$(git log -1 --pretty=%P)
            for parent_sha in $parent_shas;
            do
              if [ -n "$body_content" ]; then
                body_content+=$'\n\n'
              fi
              body_content+=$(git log --format=%B -n 1 $parent_sha)
            done
          else
            body_content="${{ steps.get_commit_message.outputs.commit_message }}"
          fi
          {
            echo "body<<EOF"
            echo "$body_content"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Download compiled build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release on Bleeding Edge Repository
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.BLEEDING_EDGE_TOKEN }}
          repo_name: "EggleEgg/ModHearth-Builds"
          tag: ${{ steps.release_tag.outputs.tag }}
          release_name: ${{ steps.release_tag.outputs.name }}
          body: ${{ steps.set_release_body.outputs.body }}
          file: dist/*
          file_glob: true
          overwrite: true

  # --- Status reporting ---
  release-status:
    runs-on: ubuntu-latest
    needs: [build-test-publish, compute-version, release, bleeding-edge-push]
    if: ${{ always() }}
    steps:
      - name: Report release status
        run: |
          if [ "${{ needs.build-test-publish.result }}" != "success" ]; then
            echo "Pipeline skipped or failed because build/test matrix failed."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ needs.release.result }}" != "success" ]; then
              echo "Production Release generation failed."
              exit 1
            fi
            echo "Production release created successfully!"
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ needs.bleeding-edge-push.result }}" != "success" ]; then
              echo "Bleeding Edge Release creation failed."
              exit 1
            fi
            echo "Bleeding Edge Release created successfully!"
          fi
